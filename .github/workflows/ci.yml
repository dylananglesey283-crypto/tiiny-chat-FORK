# Tests and an unsigned debug build on every push and pull request. Uses no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug :app:lintRelease --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
