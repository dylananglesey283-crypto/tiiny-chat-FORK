# Signed release build for a version tag (e.g. v1.0.0).
# Needs the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (see docs/RELEASE.md).
# The keystore is decoded into the runner's temporary directory only and deleted afterwards.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD are required."; exit 1
          fi

      - name: Test and build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TIINY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export TIINY_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$TIINY_KEYSTORE_FILE"
          trap 'rm -f "$TIINY_KEYSTORE_FILE"' EXIT
          ./gradlew :core:test :app:assembleRelease --console=plain

      - name: Verify signature and prepare files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="tiiny-chat-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" 'index($0, v) == 1 {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          { echo; echo "Signing certificate:"; echo '```'; grep "SHA-256" signature.txt; echo '```'; } >> notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Tiiny Chat $VERSION" --notes-file notes.md
